name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-backend:
    name: Django tests with PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agronexus_test_db
          POSTGRES_USER: agronexus_user
          POSTGRES_PASSWORD: agronexus_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agronexus_user -d agronexus_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DEBUG: "True"
      SECRET_KEY: "django-insecure-agronexus-ci-only-key"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: agronexus_test_db
      DB_USER: agronexus_user
      DB_PASSWORD: agronexus_ci_password
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python -m pytest