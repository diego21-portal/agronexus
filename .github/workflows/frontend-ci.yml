name: Frontend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality:
    name: Frontend Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test:run

      - name: Build production frontend
        run: npm run build

  windows-build:
    name: Windows build with npm 12
    runs-on: windows-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install with npm 12.0.1
        run: npm exec --yes --package=npm@12.0.1 -- npm ci
      - name: Build with npm 12.0.1
        run: npm exec --yes --package=npm@12.0.1 -- npm run build

  e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest

    needs:
      - quality

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e

  auth-e2e:
    name: Marketplace against Django
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agronexus_auth_e2e
          POSTGRES_USER: agronexus_user
          POSTGRES_PASSWORD: agronexus_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U agronexus_user -d agronexus_auth_e2e"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: django-insecure-auth-e2e-only-key
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4176
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: agronexus_auth_e2e
      DB_USER: agronexus_user
      DB_PASSWORD: agronexus_ci_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      VITE_API_BASE_URL: http://127.0.0.1:8001/api/v1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Prepare isolated demo database
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
      - name: Start Django
        working-directory: backend
        run: |
          python manage.py runserver 127.0.0.1:8001 --noreload > "$RUNNER_TEMP/auth-backend.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8001/ready/; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/auth-backend.log"
          exit 1
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Test sessions, checkout and administration
        working-directory: frontend
        run: npm run e2e:auth
