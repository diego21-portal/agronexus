name: Docker Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  docker-build:
    name: Build Django Docker image
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -t agronexus-backend:test .

      - name: Check isolated container migrations and command discovery
        run: >-
          docker run --rm
          -e DB_ENGINE=django.db.backends.sqlite3
          -e DB_NAME=/tmp/agronexus-smoke.sqlite3
          agronexus-backend:test
          sh -c "python manage.py migrate --noinput &&
                 python manage.py check &&
                 python manage.py help audit_aftersales"

  production-images:
    name: Production images and HTTPS smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build production backend
        run: docker build -f ops/Dockerfile.backend -t agronexus-backend:ci .
      - name: Build production frontend
        run: docker build -f ops/Dockerfile.frontend -t agronexus-frontend:ci .
      - name: Check production settings and Nginx HTTPS routing
        run: bash ops/ci-smoke.sh
      - name: Verify the local demo starts and preserves changes
        run: python3 ops/ci-demo.py
