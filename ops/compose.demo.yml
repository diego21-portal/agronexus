name: agronexus-demo

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agronexus_demo
      POSTGRES_USER: agronexus_demo
      POSTGRES_PASSWORD: agronexus-demo-local
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "agronexus_demo", "-d", "agronexus_demo"]
      interval: 3s
      timeout: 3s
      retries: 15

  web:
    image: ${AGRONEXUS_DEMO_BACKEND_IMAGE:-agronexus-demo-backend:local}
    build:
      context: ..
      dockerfile: ops/Dockerfile.backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: django-insecure-agronexus-demo-loopback-only
      ALLOWED_HOSTS: 127.0.0.1,localhost
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: agronexus_demo
      DB_USER: agronexus_demo
      DB_PASSWORD: agronexus-demo-local
      DB_HOST: db
      DB_PORT: "5432"
    command:
      - sh
      - -ec
      - |
        python manage.py migrate --noinput
        python manage.py seed_demo --if-empty
        python manage.py collectstatic --noinput
        exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 4
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready/', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 15s

  proxy:
    image: ${AGRONEXUS_DEMO_FRONTEND_IMAGE:-agronexus-demo-frontend:local}
    build:
      context: ..
      dockerfile: ops/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "127.0.0.1:${AGRONEXUS_DEMO_PORT:-8088}:80"
    volumes:
      - ./nginx.demo.conf.template:/etc/nginx/templates/default.conf.template:ro
      - media:/srv/media:ro
      - staticfiles:/srv/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/ready/"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  db:
  media:
  staticfiles:
