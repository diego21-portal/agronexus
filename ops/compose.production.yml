name: agronexus-production

services:
  web:
    build:
      context: ..
      dockerfile: ops/Dockerfile.backend
    image: agronexus-backend:${RELEASE_TAG:-local}
    restart: unless-stopped
    env_file: .env.production
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          host = os.environ['ALLOWED_HOSTS'].split(',')[0].strip();
          request = urllib.request.Request('http://127.0.0.1:8000/ready/',
          headers={'Host': host, 'X-Forwarded-Proto': 'https'});
          urllib.request.urlopen(request, timeout=5)
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  proxy:
    build:
      context: ..
      dockerfile: ops/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api/v1
    image: agronexus-frontend:${RELEASE_TAG:-local}
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in ops/.env.production}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in ops/.env.production}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - media:/srv/media:ro
      - staticfiles:/srv/staticfiles:ro
      - ./tls:/etc/nginx/tls:ro
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_healthy

volumes:
  media:
  staticfiles:
